name: Build DV
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk DV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DV-apk
          path: DV.apk

      # main 分支每次提交: 更新 "latest" 预发布 (只有 APK)
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DV.apk --prerelease --title "DV 开发版 (自动编译)" \
            --notes "main 分支最新提交 ${GITHUB_SHA::7} 自动编译, 仅含 APK。正式版请看带版本号的 Release。" \
            --target "$GITHUB_SHA"

      # 推送 v* 标签: 打包 PC 端 (带 ffmpeg + adb) 并发布正式 Release
      - name: Package PC
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          D=pkg/DV
          mkdir -p $D/pc $D/adb
          cp DV.bat README.md DV.apk $D/
          cp pc/dv_server.py $D/pc/
          cp adb/修复ADB.bat adb/fix_adb.ps1 $D/adb/
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -j -q ff.zip '*/bin/ffmpeg.exe' -d $D/pc/
          pip download --no-deps --only-binary=:all: --platform win_amd64 --python-version 3.12 adbutils -d whl -q
          unzip -j -q whl/*.whl 'adbutils/binaries/adb.exe' 'adbutils/binaries/AdbWinApi.dll' 'adbutils/binaries/AdbWinUsbApi.dll' -d $D/adb/
          (cd pkg && zip -q -r -9 "../DV-PC-${GITHUB_REF_NAME}.zip" DV)
          cp DV.apk "DV-${GITHUB_REF_NAME}.apk"
          ls -la *.zip *.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=release-notes/${GITHUB_REF_NAME}.md
          [ -f "$NOTES" ] || { echo "DV ${GITHUB_REF_NAME}" > /tmp/n.md; NOTES=/tmp/n.md; }
          gh release create "$GITHUB_REF_NAME" "DV-PC-${GITHUB_REF_NAME}.zip" "DV-${GITHUB_REF_NAME}.apk" \
            --title "DV ${GITHUB_REF_NAME}" --notes-file "$NOTES" --latest

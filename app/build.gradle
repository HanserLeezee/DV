plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.hans.dv'
    compileSdk = 35

    defaultConfig {
        applicationId = 'com.hans.dv'
        minSdk = 24
        targetSdk = 34
        versionCode = 4
        versionName = '0.4'
    }

    // 固定签名: 每次 CI 编译出来的 APK 签名一致, 才能直接覆盖升级
    signingConfigs {
        dv {
            storeFile = file('dv.keystore')
            storePassword = 'dvdvdv'
            keyAlias = 'dv'
            keyPassword = 'dvdvdv'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.dv
        }
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.dv
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

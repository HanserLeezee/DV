name: Build DV
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk DV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DV-apk
          path: DV.apk

      - name: Publish latest APK (开发版)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DV.apk --prerelease --title "DV 开发版 (自动编译)" \
            --notes "main 分支最新提交 ${GITHUB_SHA::7} 自动编译, 仅含 APK。正式版请看带版本号的 Release。" \
            --target "$GITHUB_SHA"

      # 正式版: app/build.gradle 的 versionName 有对应的 release-notes/v<版本>.md,
      # 且这个版本还没发布过 -> 打包电脑端 (带 ffmpeg + adb) 并发布 Release
      - name: Check version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(grep -oP "versionName\s*=\s*'\K[^']+" app/build.gradle)"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if [ -f "release-notes/$V.md" ] && ! gh release view "$V" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version $V"

      - name: Package PC
        if: steps.ver.outputs.publish == 'true'
        env:
          V: ${{ steps.ver.outputs.tag }}
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          set -e
          D=pkg/DV
          mkdir -p $D/pc $D/adb
          cp DV.bat README.md DV.apk $D/
          cp pc/dv_server.py $D/pc/
          cp adb/修复ADB.bat adb/fix_adb.ps1 $D/adb/
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -j -q ff.zip '*/bin/ffmpeg.exe' -d $D/pc/
          pip download --no-deps --only-binary=:all: --platform win_amd64 --python-version 3.12 adbutils -d whl -q
          unzip -j -q whl/*.whl 'adbutils/binaries/adb.exe' 'adbutils/binaries/AdbWinApi.dll' 'adbutils/binaries/AdbWinUsbApi.dll' -d $D/adb/
          (cd pkg && zip -q -r -9 "../DV-PC-$V.zip" DV)
          cp DV.apk "DV-$V.apk"
          ls -la *.zip *.apk

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$V" "DV-PC-$V.zip" "DV-$V.apk" --target "$GITHUB_SHA" \
            --title "DV $V" --notes-file "release-notes/$V.md" --latest
